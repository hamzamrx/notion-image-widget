<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Time-Based Image</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    img {
      width: 100%;
      height: 100vh;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <script>
    const hour = new Date().getHours();
    const img = document.createElement('img');

    if (hour >= 5 && hour < 18) {
      img.src = "https://www.notion.com/_next/image?url=https%3A%2F%2Fs3.us-west-2.amazonaws.com%2Fpublic.notion-static.com%2Ftemplate%2F7d9fa075-fbe1-4fb9-9269-540ea62d5df5%2F1720371104023%2Fdesktop.jpg&w=1920&q=75"; // 🔁 Replace with your actual morning image
    } else {
      img.src = "https://www.notion.com/_next/image?url=https%3A%2F%2Fs3.us-west-2.amazonaws.com%2Fpublic.notion-static.com%2Ftemplate%2F7d9fa075-fbe1-4fb9-9269-540ea62d5df5%2F1720371104023%2Fdesktop.jpg&w=1920&q=75"; // 🔁 Replace with your evening image
    }

    document.body.appendChild(img);
  </script>
</body>
</html>
