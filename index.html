<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Solo Leveling GIF Switcher</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #gif {
      width: 100%;
      height: 100vh;
      object-fit: cover;
    }

    #toggleButton {
      position: absolute;
      bottom: 40px;
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      color: #00f0ff;
      background: #111;
      border: 2px solid #00f0ff;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 10px #00f0ff80, 0 0 20px #00f0ff40 inset;
      transition: all 0.2s ease;
      z-index: 999;
    }

    #toggleButton:hover {
      background: #00f0ff;
      color: #111;
      box-shadow: 0 0 12px #00f0ff, 0 0 25px #00f0ff inset;
    }

    #toggleButton:active {
      transform: scale(0.95);
      box-shadow: 0 0 20px #00f0ffaa, 0 0 30px #00f0ff88 inset;
    }
  </style>
</head>
<body>
  <img id="gif" src="morning.gif" alt="Solo Leveling GIF">
  <button id="toggleButton">Awaken</button>

  <script>
    const gif = document.getElementById('gif');
    const button = document.getElementById('toggleButton');

    const gif1 = "Calm Confidence in Warm Tones.png";  // Make sure this file exists in your repo
    const gif2 = "ChatGPT Image May 1, 2025, 02_44_38 PM.png";  // Same here

    let showingFirst = true;

    button.addEventListener('click', () => {
      gif.src = showingFirst ? gif2 : gif1;
      showingFirst = !showingFirst;
    });
  </script>
</body>
</html>
