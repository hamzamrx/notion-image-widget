<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>GIF Switcher Widget</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #gif {
      width: 100%;
      max-height: 90vh;
      object-fit: cover;
    }
    #toggleButton {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #ffffff;
      color: #000000;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <img id="gif" src="https://yourdomain.com/morning.gif" alt="GIF">
  <button id="toggleButton">Switch</button>

  <script>
    const gif = document.getElementById('gif');
    const button = document.getElementById('toggleButton');

    const gif1 = "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExcWcwa3BybjAydHNsNDBodmtiN2Z6ZXpreGVyMnlianhsNXVyZXI0diZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3CCXHZWV6F6O9VQ7FL/giphy.gif"; // 🔁 Replace
    const gif2 = "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejJ6NWczOGxmOG5rZXJoYzd5OW9mZzhjbWtsNHg4Zm0wNmRxOXk5MSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/x6jQMANO5PYpmoUIPj/giphy.gif"; // 🔁 Replace

    let showingFirst = true;

    button.addEventListener('click', () => {
      gif.src = showingFirst ? gif2 : gif1;
      showingFirst = !showingFirst;
    });
  </script>
</body>
</html>
